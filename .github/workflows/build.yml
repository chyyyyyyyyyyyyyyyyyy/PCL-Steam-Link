name: Build

# 构建「PCL Steam 联机修改版」：先编译 Steam 联机模块 PCLink，再嵌入主程序并打包。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Update Help
        shell: pwsh
        run: |
          # PCL 的帮助文档（Resources\Help.zip）不在源码仓库里，上游 CI 也是从 PCL2Help 临时生成。
          # 只打包“非点号开头”的顶层目录（Minecraft / 帮助 / 指南 / 百科 / 启动器 / 个性化），跳过 .git、README、LICENSE。
          $ErrorActionPreference = 'Stop'
          $ws = "${{ github.workspace }}"
          $parent = Split-Path -Parent $ws
          git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1 (Join-Path $parent 'PCL2Help')
          if ($LASTEXITCODE -ne 0) { throw "clone PCL2Help failed" }
          $helpDir = Join-Path $parent 'PCL2Help'
          $items = Get-ChildItem -Path $helpDir -Directory -Force | Where-Object { $_.Name -notlike '.*' }
          if (-not $items) { throw "PCL2Help has no help directories" }
          $items | ForEach-Object { "  - $($_.Name)" }
          $zipPath = Join-Path $helpDir 'Help.zip'
          Compress-Archive -Path $items.FullName -DestinationPath $zipPath -Force
          Copy-Item -Path $zipPath -Destination (Join-Path $ws 'Plain Craft Launcher 2\Resources\Help.zip') -Force
          Remove-Item $helpDir -Recurse -Force
          Get-Item (Join-Path $ws 'Plain Craft Launcher 2\Resources\Help.zip') | Select-Object Name, Length

      - name: Publish PCLink (Steam link module)
        run: |
          dotnet publish PCLink\PCLink.csproj -c Release -o out-pclink
          Copy-Item out-pclink\PCLink.exe "Plain Craft Launcher 2\Resources\PCLink.exe" -Force

      - name: Restore NuGet Packages
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: Build launcher
        run: msbuild "Plain Craft Launcher 2.sln" -p:Configuration=Release -p:MSBuildEnableWorkloadResolver=false -m

      - name: Collect artifacts
        shell: pwsh
        run: |
          # 统一成 ASCII 文件名，避免 GitHub 把中文名/空格替换成 default.md、Plain.Craft....
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe" "dist\PCL-Steam-Link.exe" -Force
          Copy-Item "PCLink\steam_appid.txt" dist\ -Force -ErrorAction SilentlyContinue
          if (Test-Path "说明.md") { Copy-Item "说明.md" "dist\usage-zh.md" -Force }
          Copy-Item "README.md" "dist\README.md" -Force
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-Steam-Link-Release
          path: dist\**
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/PCL-Steam-Link.exe
            dist/usage-zh.md
            dist/README.md
          body: |
            ## PCL Steam 联机修改版 ${{ github.ref_name }}

            基于 [Meloong-Git/PCL](https://github.com/Meloong-Git/PCL) 2.13.1.1 的第三方修改版，
            把原本需要 EasyTier 的「联机」页改成通过 **Steam 网络（SteamNetworkingSockets）** 转发，
            不需要任何公网服务器或中继账号。

            ### 怎么用
            1. 双方都装好 Steam 客户端并登录、互为 Steam 好友。
            2. 房主在 PCL 里启动游戏 → 进入单人存档 →「对局域网开放」→ 记下端口（如 25565）。
            3. PCL 里点「联机」→「创建房间」→ 输入刚才的端口 → 得到房间号（17 位数字）。
            4. 加入方 PCL 里点「联机」→「加入房间」→ 填房间号 → 启动游戏 → 多人游戏 → 直连 `localhost:8888`。

            ### 注意
            - 主程序是 .NET Framework 4.8 桌面程序，联机模块 PCLink 是自包含单文件，无需另装 .NET。
            - 本修改版与 PCL 官方无关；许可遵循仓库内 `LICENCE`（PCL 分发有限许可）。
            - Steam 联机依赖 Steam 官方 P2P 中继，网络质量受 Steam 影响。

            ### 联机模块的出处
            转发模型参考自开源项目 **[connecttool-qt](https://github.com/moeleak/connecttool-qt)**（作者 **Ji Fuyao**，
            MIT 许可，Copyright (c) 2025 Ji Fuyao）：它用 Steam 网络（`SteamNetworkingSockets`）做 TCP 转发 / TUN 组网。
            本项目的 `PCLink` 是按此思路用 C# + [Steamworks.NET](https://github.com/rlabrecque/Steamworks.NET) 重写的实现
            （未复制其源码），并补充了 `host` / `join` / `selftest` 命令行接口供启动器调用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
